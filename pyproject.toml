[project]
name = "vamos"
version = "0.1.0"
description = "Inference and deployment utilities for VAMOS navigation VLMs"
readme = "README.md"
requires-python = ">=3.11, <3.12"
# Only what VAMOS inference, the demo script/notebook and the Zenoh nodes import.
# Everything else lives in an opt-in group so a Jetson install stays small.
dependencies = [
    "accelerate>=0.20.0",
    "huggingface-hub>=0.16.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "peft>=0.4.0",
    "pillow>=9.5.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
]

[dependency-groups]
zenoh = [
    "eclipse-zenoh>=1.0,<2",
    "json5>=0.9",
]
dev = [
    "ipykernel>=6.20.0",
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
]
# server/vlm_server.py
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
]
# vamos_ws ROS nodes, including the ONNX affordance/value models and the
# optimum export path in vlm_trajectory_predictor.py.
ros = [
    "catkin-pkg>=1.0.0",
    "catkin-tools>=0.9.5",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "optimum[exporters,onnxruntime]>=1.16.0,<2",
    "rospkg>=1.6.0",
    "trajectory-prediction",
    "trajectory-projection",
]

[tool.uv.sources]
# Windows dev machines use the CUDA 12.8 wheels. Jetson AGX Orin (JetPack 7.2,
# L4T r39.2, aarch64/SBSA) uses the CUDA 13.2 index, as in the NaVILA fork.
# Other Linux x86_64 hosts keep resolving torch from PyPI.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
trajectory-prediction = { path = "vamos_ws/src/trajectory_prediction", editable = true }
trajectory-projection = { path = "vamos_ws/src/trajectory_projection", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
default-groups = []
package = false
